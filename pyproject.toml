[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emporio"
version = "0.1.0"
description = "Customer-support agent for Empório da Música"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
emporio = "emporio.agent:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
